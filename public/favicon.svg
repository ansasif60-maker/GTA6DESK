<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="60%" stop-color="#9E00FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#FF007A" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00F0FF" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#030508" />
  
  <!-- Top Neon Line -->
  <line x1="12" y1="36" x2="42" y2="36" stroke="#FF007A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="36" x2="88" y2="36" stroke="#FF007A" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Bottom Neon Line -->
  <line x1="12" y1="64" x2="42" y2="64" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="64" x2="88" y2="64" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- GTA text -->
  <text x="13" y="55" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="19" fill="#FFFFFF" font-style="italic">GTA</text>
  
  <!-- 6 digit -->
  <text x="44" y="59" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="url(#grad6)" font-style="italic">6</text>
  
  <!-- DESK text -->
  <text x="59" y="55" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="17" fill="#FFFFFF" font-style="italic">DESK</text>
</svg>
